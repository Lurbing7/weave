name: Release Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installer and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Weave v__VERSION__"
          releaseBody: "Windows x64 installer for Weave. Download the setup executable from Assets."
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          args: --bundles nsis
